<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AgriSmart</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body{
            font-family:'Poppins',sans-serif;
            background:linear-gradient(135deg,#f0fdf4,#dcfce7);
        }

        .login-card{
            background:rgba(255,255,255,.95);
            backdrop-filter:blur(10px);
        }

        input:focus{
            outline:none;
        }
    </style>
</head>

<body>

<div class="min-h-screen flex items-center justify-center p-6">

    <div class="login-card w-full max-w-md rounded-3xl shadow-2xl p-10">

        <!-- Logo -->

        <div class="text-center mb-8">

            <div class="w-20 h-20 mx-auto rounded-full bg-green-100 flex items-center justify-center mb-4">

                <i class="fas fa-seedling text-4xl text-green-600"></i>

            </div>

            <h1 class="text-3xl font-bold text-green-700">
                AgriSmart
            </h1>

            <p class="text-gray-500 mt-2">
                Smart Crop Recommendation System
            </p>

        </div>

        <!-- Welcome -->

        <div class="text-center mb-8">

            <h2 class="text-2xl font-bold text-gray-800">
                Welcome Back
            </h2>

            <p class="text-gray-500 mt-2">
                Login to continue to your dashboard.
            </p>

        </div>

        <!-- Form -->

        <form action="/login" method="POST" class="space-y-6">

            <!-- Mobile -->

            <div>

                <label class="block mb-2 font-medium text-gray-700">
                    Mobile Number
                </label>

                <div class="relative">

                    <i class="fas fa-phone absolute left-4 top-4 text-gray-400"></i>

                    <input
                        type="text"
                        name="mobile"
                        placeholder="Enter your mobile number"
                        required
                        class="w-full border border-gray-300 rounded-xl py-3 pl-12 pr-4 focus:ring-2 focus:ring-green-500">

                </div>

            </div>

            <!-- Password -->

            <div>

                <label class="block mb-2 font-medium text-gray-700">
                    Password
                </label>

                <div class="relative">

                    <i class="fas fa-lock absolute left-4 top-4 text-gray-400"></i>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        class="w-full border border-gray-300 rounded-xl py-3 pl-12 pr-4 focus:ring-2 focus:ring-green-500">

                </div>

            </div>

            <!-- Login -->

            <button
                type="submit"
                class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-semibold transition duration-300">

                Login

            </button>

        </form>

        <!-- Register -->

        <div class="text-center mt-8">

            <p class="text-gray-600">

                Don't have an account?

               <a href="{{ url_for('register') }}"
               class="text-green-600 font-semibold hover:underline">

               Create Account

            </a>

            </p>

        </div>

        <!-- Footer -->

        <div class="border-t mt-8 pt-5">

            <p class="text-center text-xs text-gray-400">

                <i class="fas fa-shield-alt text-green-500"></i>

                Secure access for Farmers & Agricultural Officers

            </p>

        </div>

    </div>

</div>

</body>
</html>
