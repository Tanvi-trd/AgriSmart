<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | AgriSmart</title>
    <!-- Poppins Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff;
            /* Subtle Leaf Pattern Background */
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5c-5 0-10 5-10 10s5 10 10 10 10-5 10-10-5-10-10-10zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z' fill='%2310b981' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
        }

        .form-input {
            transition: all 0.3s ease;
            border: 1px solid #e2e8f0;
        }

        .form-input:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
            outline: none;
        }

        .custom-radio:checked + label {
            border-color: #10b981;
            background-color: #f0fdf4;
            color: #065f46;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <!-- Registration Card -->
    <div class="w-full max-w-[500px] bg-white rounded-[16px] shadow-[0_10px_25px_-5px_rgba(0,0,0,0.1),0_8px_10px_-6px_rgba(0,0,0,0.1)] border border-gray-100 p-8 md:p-10">
        
        <!-- Header Section -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-green-50 rounded-full mb-4">
                <i class="fas fa-leaf text-2xl text-green-600"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Create Your Account</h1>
            <p class="text-gray-500 text-sm mt-2 leading-relaxed">
                Register to access AI-powered crop recommendations based on soil and climate conditions.
            </p>
        </div>

        <!-- Form Section -->
        <form action="/register" method="POST" class="space-y-5">
            
            <!-- Full Name -->
            <div class="relative">
                <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="text" name="fullname" placeholder="Full Name" required
                    class="form-input w-full pl-11 pr-4 py-3 rounded-xl text-sm bg-gray-50/50">
            </div>

            <!-- Mobile & Email Row -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="relative">
                    <i class="fas fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="tel" name="mobile" placeholder="Mobile Number" required
                        class="form-input w-full pl-11 pr-4 py-3 rounded-xl text-sm bg-gray-50/50">
                </div>
                <div class="relative">
                    <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="email" name="email" placeholder="Email (Optional)"
                        class="form-input w-full pl-11 pr-4 py-3 rounded-xl text-sm bg-gray-50/50">
                </div>
            </div>

            <!-- Role Selection -->
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Select Your Role</label>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <input type="radio" name="role" id="farmer" value="farmer" class="hidden custom-radio" checked>
                        <label for="farmer" class="flex items-center justify-center gap-2 py-3 border rounded-xl cursor-pointer text-sm font-medium text-gray-600 transition-all hover:bg-gray-50">
                            <span>👨‍🌾</span> Farmer
                        </label>
                    </div>
                    <div>
                        <input type="radio" name="role" id="officer" value="officer" class="hidden custom-radio">
                        <label for="officer" class="flex items-center justify-center gap-2 py-3 border rounded-xl cursor-pointer text-sm font-medium text-gray-600 transition-all hover:bg-gray-50">
                            <span>🏢</span> Officer
                        </label>
                    </div>
                </div>
            </div>

            <!-- Location Row -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="relative">
                    <i class="fas fa-map absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm pointer-events-none"></i>
                    <select name="state" class="form-input w-full pl-11 pr-4 py-3 rounded-xl text-sm bg-gray-50/50 appearance-none">
                        <option value="Karnataka" selected>Karnataka</option>
                    </select>
                </div>
                <div class="relative">
                    <i class="fas fa-map-marker-alt absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm pointer-events-none"></i>
                    <select name="district" class="form-input w-full pl-11 pr-10 py-3 rounded-xl text-sm bg-gray-50/50 appearance-none">
                        <option value="" disabled selected>Select District</option>
                        <option value="Belagavi">Belagavi</option>
                        <option value="Raichur">Raichur</option>
                        <option value="Dakshina Kannada">Dakshina Kannada</option>
                        <option value="Udupi">Udupi</option>
                        <option value="Shivamogga">Shivamogga</option>
                    </select>
                    <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 text-[10px] pointer-events-none"></i>
                </div>
            </div>

            <!-- Password -->
            <div class="relative">
                <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="password" id="password" name="password" placeholder="Password" required
                    class="form-input w-full pl-11 pr-12 py-3 rounded-xl text-sm bg-gray-50/50">
                <button type="button" onclick="togglePassword('password', 'eye1')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-green-600">
                    <i id="eye1" class="fas fa-eye-slash text-sm"></i>
                </button>
            </div>

            <!-- Confirm Password -->
            <div class="relative">
                <i class="fas fa-shield-check absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required
                    class="form-input w-full pl-11 pr-12 py-3 rounded-xl text-sm bg-gray-50/50">
                <button type="button" onclick="togglePassword('confirm_password', 'eye2')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-green-600">
                    <i id="eye2" class="fas fa-eye-slash text-sm"></i>
                </button>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3.5 rounded-xl transition-all duration-300 shadow-lg shadow-green-100 hover:shadow-green-200 active:scale-[0.98] mt-2">
                Create Account
            </button>

            <!-- Footer Link -->
            <div class="text-center pt-4 border-t border-gray-50 mt-4">
                <p class="text-sm text-gray-500">
                    Already have an account? 
                   <a href="{{ url_for('login') }}" class="text-green-600 font-bold hover:underline transition-all">
                    Login
                   </a>
                </p>
            </div>
        </form>
    </div>

    <!-- Script for Password Toggle -->
    <script>
        function togglePassword(inputId, eyeId) {
            const input = document.getElementById(inputId);
            const eye = document.getElementById(eyeId);
            if (input.type === "password") {
                input.type = "text";
                eye.classList.replace("fa-eye-slash", "fa-eye");
            } else {
                input.type = "password";
                eye.classList.replace("fa-eye", "fa-eye-slash");
            }
        }
    </script>
</body>
</html>
